[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robodata-check"
version = "0.1.0"
description = "Local dataset quality checks for LeRobot v3.0"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyarrow==23.0.1"]

[project.scripts]
robodatacheck = "prototype.run_prototype:cli"

[tool.setuptools.packages.find]
include = ["prototype"]
